<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONSTITA — Últimas peças. Novos caminhos.</title>
<meta name="description" content="Últimas peças da coleção atual, com atendimento online pelo WhatsApp.">
<meta property="og:title" content="CONSTITA — Últimas peças. Novos caminhos.">
<link rel="icon" href="img/k.jpg">
<script>try{var _t=JSON.parse(localStorage.getItem("constita-tema")||"null");if(_t){var _s=document.createElement("style");_s.id="tema";_s.textContent=_t.css;document.head.appendChild(_s);for(var _k in _t.attrs)document.documentElement.setAttribute(_k,_t.attrs[_k]);if(_t.fonte){var _l=document.createElement("link");_l.id="fonte-tema";_l.rel="stylesheet";_l.href=_t.fonte;document.head.appendChild(_l)}}}catch(e){}</script>
<link id="fonte-base" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#faf8f4;--ink:#1c1814;--mute:#7a7066;--line:#e6dfd4;--card:#f3eee6;--dk:#1c1814;--dkt:#faf8f4;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161311;--ink:#f1ebe1;--mute:#a1968a;--line:#332d27;--card:#1e1a17;--dk:#f1ebe1;--dkt:#161311}}
:root[data-theme="dark"]{--bg:#161311;--ink:#f1ebe1;--mute:#a1968a;--line:#332d27;--card:#1e1a17;--dk:#f1ebe1;--dkt:#161311}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--base,15px)/1.7 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:var(--wt,400);margin:0;line-height:1.1}
h1,h2{text-transform:var(--ttt,none)}h2{letter-spacing:var(--tls,0)}
:focus-visible{outline:2px solid var(--acc,var(--ink));outline-offset:2px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:var(--sec,96px) 0}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin:0 0 20px}
h2{font-size:clamp(32px,6vw,48px)}
.lead{color:var(--mute);max-width:480px;margin:18px 0 0}
.btn{display:inline-block;padding:14px 30px;font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--dk);background:var(--dk);color:var(--dkt);border-radius:var(--rb,0);cursor:pointer;transition:opacity .2s;text-align:center}
.btn:hover{opacity:.8}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* Cabeçalho fixo: logo grande no topo, encolhe ao rolar e nunca sai da tela */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;transition:height .25s}
.scrolled header .wrap{height:56px}
.logo{display:inline-flex;align-items:center;gap:.45em;font:400 clamp(24px,7vw,34px)/1 var(--serif);letter-spacing:.2em;transition:font-size .25s}
.logo img{width:1.2em;height:1.2em;border-radius:5px;object-fit:cover;flex:none}
.scrolled header .logo{font-size:20px}
.cartbtn{background:none;border:0;color:var(--ink);font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:8px 0}

.hero{padding:80px 0 56px;text-align:center}
.hero h1{font-size:clamp(44px,10vw,88px);font-weight:var(--wt,300);letter-spacing:calc(-.01em + var(--tls,0em))}
.hero h1 em{color:var(--mute)}
.hero p.t{max-width:460px;margin:26px auto 36px;color:var(--mute)}
.nota{margin:22px 0 0;font-size:13px;color:var(--mute)}

/* Carrossel central */
#destaques{padding:24px 0 40px}
#destaques .cab{text-align:center;margin-bottom:28px}
#destaques .cab .eyebrow{margin:0}
.car{position:relative}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track article{flex:0 0 min(230px,64vw);scroll-snap-align:start}
.arrow{position:absolute;top:34%;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;cursor:pointer;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.arrow.p{left:-8px}.arrow.n{right:-8px}
@media(min-width:1140px){.arrow.p{left:-56px}.arrow.n{right:-56px}}

.chips{display:flex;gap:26px;overflow-x:auto;margin-top:40px;padding-bottom:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;border:0;border-bottom:1px solid transparent;padding:0 0 8px;color:var(--mute);font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--acc,var(--ink))}
.grid{display:grid;grid-template-columns:repeat(var(--cols-m,2),1fr);gap:28px 16px;margin-top:40px}
@media(min-width:800px){.grid{grid-template-columns:repeat(var(--cols-d,4),1fr);gap:40px 24px}}
.ph{aspect-ratio:var(--prop,3/4);position:relative;overflow:hidden;border-radius:var(--r,0)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph[data-open]{cursor:pointer}.ph:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nfotos{position:absolute;right:8px;bottom:8px;z-index:1;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.06em}
.ver{background:none;border:0;padding:0;color:var(--mute);font:400 12px var(--sans);text-decoration:underline;cursor:pointer;text-align:left;width:max-content}
.info h3[data-open]{cursor:pointer}
.off{position:absolute;top:10px;right:10px;z-index:1;background:var(--acc,var(--dk));color:var(--acct,var(--dkt));font:500 10px var(--sans);letter-spacing:.1em;padding:4px 8px;border-radius:var(--rbd,0)}
.offi{display:inline-block;background:var(--acc,var(--dk));color:var(--acct,var(--dkt));font-size:11px;letter-spacing:.08em;padding:2px 8px;margin-left:8px;vertical-align:middle;border-radius:var(--rbd,0)}
.ate{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.badge{position:absolute;top:10px;left:10px;z-index:1;font-size:9px;letter-spacing:.16em;background:var(--bg);color:var(--ink);padding:4px 8px;text-transform:uppercase;border-radius:var(--rbd,0)}
.info{padding-top:14px;display:flex;flex-direction:column;gap:4px}
.info h3{font-size:20px}
.pr{font-size:14px}.pr s{color:var(--mute);margin-right:8px;font-size:13px}
.szs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;padding:2px}
.tb{min-width:34px;padding:4px 8px;border-radius:var(--rbd,0);border:1px solid var(--line);background:transparent;color:var(--ink);font:400 12px var(--sans);cursor:pointer}
.tb.on{background:var(--dk);color:var(--dkt);border-color:var(--dk)}
.szs.need{outline:1px solid var(--ink);outline-offset:3px}
.szs.cores{align-items:center;gap:8px}
.cb{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer}
.cb.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.cn{font-size:12px;color:var(--mute)}
.opc{display:grid;gap:8px}
.add{margin-top:10px;width:100%}
.add.in{background:transparent;color:var(--ink)}
.empty{color:var(--mute);grid-column:1/-1}

.next{background:var(--card);text-align:center}
.next .lead{margin-left:auto;margin-right:auto}
.brands{display:grid;gap:48px;margin-top:64px}
@media(min-width:800px){.brands{grid-template-columns:1fr 1fr}}
.brand h3{font-size:40px;letter-spacing:.14em;font-weight:300}
.brand .tag{font-size:10px;letter-spacing:.24em;color:var(--mute);margin:10px 0 14px;text-transform:uppercase}
.brand p{color:var(--mute);margin:0 auto;max-width:340px}
.soon{margin-top:64px;font:italic 400 24px var(--serif);color:var(--mute)}
.center{text-align:center}.center .lead{margin-left:auto;margin-right:auto}
.center .btn{margin-top:32px}
footer{border-top:1px solid var(--line);padding:40px 0 100px;text-align:center;color:var(--mute);font-size:13px}
footer .logo{margin-bottom:12px;color:var(--ink);font-size:22px}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--acc,var(--dk));color:var(--acct,var(--dkt));font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:14px 22px;border-radius:99px}
.erro{display:none;background:#8a2b2b;color:#fff;padding:12px 24px;font-size:14px}
.erro.on{display:block}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.ov.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dh h3{font-size:28px}
.x{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer;line-height:1}
.dbody{flex:1;overflow-y:auto;min-height:0}
.items{padding:8px 0}
.it{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.sw{width:52px;height:68px;flex:none;position:relative;overflow:hidden}
.sw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it .d{flex:1}
.it b{font:400 18px var(--serif);display:block;line-height:1.2}
.it small{color:var(--mute);font-size:12px}
.rm{background:none;border:0;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:underline}
.tot{display:flex;justify-content:space-between;padding:12px 0 16px;font-size:16px}
.dfoot{border-top:1px solid var(--line);padding-top:12px}
.lin{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--mute);padding:2px 0}
.bloco{padding:14px 0;border-top:1px solid var(--line)}
.bloco label.t{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.lin2{display:flex;gap:8px}
.lin2 input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:var(--r,0)}
.lin2 .btn{padding:10px 16px}
.msg{margin:6px 0 0;font-size:13px;color:var(--mute)}.msg.ok{color:var(--ink)}.msg.er{color:#c0504d}
.msg button{background:none;border:0;padding:0 0 0 6px;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer}
.opf{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:13px;cursor:pointer;line-height:1.4}
.opf input{margin-top:3px}.opf small{display:block;color:var(--mute)}
.mi .sku{font-size:12px;color:var(--mute);letter-spacing:.08em;margin:-6px 0 0}
.drawer .btn{width:100%}
.dempty{color:var(--mute);padding:30px 0}
/* Popup de detalhes */
html.trava{overflow:hidden}
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(940px,calc(100% - 20px));max-height:calc(100dvh - 20px);overflow:auto;margin:auto;border-radius:var(--r,0)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.mbox{position:relative;display:grid;min-height:100%}
@media(min-width:780px){.mbox{grid-template-columns:1.1fr 1fr}}
.mx{position:absolute;top:10px;right:10px;z-index:4;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mg{background:var(--card)}
.mg-main{position:relative;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.mg-main img{width:100%;height:100%;object-fit:contain}
.mg-main .ini{font:300 72px var(--serif);color:rgba(255,255,255,.7)}
.mn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:22px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:2}
.mn.p{left:10px}.mn.n{right:10px}
.mct{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 9px;border-radius:99px}
.mth{display:flex;gap:6px;padding:10px;overflow-x:auto}
.mth button{flex:none;width:52px;height:68px;padding:0;border:1px solid var(--line);background:var(--line);opacity:.6;cursor:pointer}
.mth button.on{opacity:1;border-color:var(--ink)}
.mth img{width:100%;height:100%;object-fit:cover;display:block}
.mi{padding:30px 26px 28px;display:flex;flex-direction:column;gap:14px}
.mi h3{font-size:34px;font-weight:300;padding-right:36px}
.mi .cat{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0}
.mi .pr{font-size:18px}
.md{color:var(--ink);font-size:15px}.md p{margin:0 0 .8em}.md ul{margin:0 0 .8em;padding-left:1.2em}.md>:last-child{margin-bottom:0}
/* Carrinho: campos de cupom e CEP (o .drawer .btn de largura total esmagava o campo no celular) */
.lin2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.lin2 input{width:100%;min-width:0;min-height:46px;padding:0 12px;font-size:16px}
.lin2 .btn{width:auto;min-height:46px;padding:0 18px;white-space:nowrap}
@media(max-width:380px){.lin2{grid-template-columns:1fr}.lin2 .btn{width:100%}}
/* Busca, ordenação e paginação */
.busca{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px 14px;align-items:center;margin-top:28px}
.bx{position:relative}
.bx input{width:100%;min-height:46px;padding:0 40px 0 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px var(--sans);border-radius:var(--r,0);-webkit-appearance:none;appearance:none}
.qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer}
.busca select{min-height:46px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px var(--sans);border-radius:var(--r,0)}
.chkp{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);cursor:pointer;white-space:nowrap}
@media(max-width:700px){.busca{grid-template-columns:1fr 1fr}.bx{grid-column:1/-1}.chkp{grid-column:1/-1}}
.cont{margin:14px 0 0;font-size:12px;color:var(--mute);letter-spacing:.06em;min-height:1.4em}
.mais{text-align:center;margin-top:36px}
/* Vídeo */
.mg-main video{width:100%;height:100%;object-fit:contain;background:#000}
.mth button{position:relative}
.pl{position:absolute;left:0;right:0;bottom:3px;text-align:center;color:#fff;font-size:12px;text-shadow:0 0 4px #000;pointer-events:none}
/* Variações de layout escolhidas no tema */
html[data-cartao=moldura] .pc{border:1px solid var(--line);padding:10px;background:var(--card);border-radius:var(--r,0)}
html[data-cartao=sombra] .pc{padding:10px;background:var(--card);border-radius:var(--r,0);box-shadow:0 4px 18px rgba(0,0,0,.1)}
@media(min-width:700px){html[data-cab=centro] header .wrap{justify-content:center;position:relative}
html[data-cab=centro] .cartbtn{position:absolute;right:24px;top:50%;transform:translateY(-50%)}}
html[data-cab=estatico] header{position:static}
html[data-abertura=esquerda] .hero{text-align:left}
html[data-abertura=esquerda] .hero p.t{margin-left:0;margin-right:0}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.logo,header .wrap,.drawer{transition:none}}
</style>
</head>
<body>
<div class="erro" id="erro" role="alert"></div>
<header><div class="wrap">
  <a class="logo" href="#topo"><img src="img/k.jpg" alt="" width="34" height="34"><span id="logo">CONSTITA</span></a>
  <button class="cartbtn" id="open" type="button">Carrinho (<span id="cnt">0</span>)</button>
</div></header>

<main id="topo">
<section class="hero"><div class="wrap">
  <p class="eyebrow" id="h-eyebrow"></p>
  <h1><span id="h-chamada"></span><br><em id="h-destaque"></em></h1>
  <p class="t" id="h-texto"></p>
  <a class="btn" href="#pecas">Ver peças</a>
  <p class="nota" id="aviso"></p>
</div></section>

<section id="destaques"><div class="wrap">
  <div class="cab"><p class="eyebrow" id="d-titulo"></p></div>
  <div class="car">
    <button class="arrow p" id="prev" type="button" aria-label="Anterior">‹</button>
    <div class="track" id="track"></div>
    <button class="arrow n" id="next" type="button" aria-label="Próximo">›</button>
  </div>
</div></section>

<section id="pecas" style="padding-top:40px"><div class="wrap">
  <p class="eyebrow" id="p-eyebrow"></p>
  <h2 id="p-titulo"></h2>
  <p class="lead" id="p-texto"></p>
  <div class="busca" role="search">
    <div class="bx"><input type="search" id="q" placeholder="Buscar peça, SKU ou cor" aria-label="Buscar peças" autocomplete="off" enterkeyhint="search"><button type="button" class="qx" id="q-x" aria-label="Limpar busca" hidden>×</button></div>
    <select id="ord" aria-label="Ordenar peças"><option value="">Ordem da loja</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="az">Nome A–Z</option><option value="desc">Maior desconto</option></select>
    <label class="chkp"><input type="checkbox" id="so-promo"> Só promoções</label>
  </div>
  <div class="chips" id="chips"></div>
  <p class="cont" id="cont" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div class="mais" id="mais" hidden><button class="btn ghost" id="ver-mais" type="button">Ver mais peças</button></div>
</div></section>

<section class="next"><div class="wrap">
  <p class="eyebrow" id="n-eyebrow"></p>
  <h2 id="n-titulo"></h2>
  <p class="lead" id="n-texto"></p>
  <div class="brands" id="marcas"></div>
  <p class="soon" id="n-frase"></p>
</div></section>

<section class="center"><div class="wrap">
  <p class="eyebrow" id="nv-eyebrow"></p>
  <h2 id="nv-titulo"></h2>
  <p class="lead" id="nv-texto"></p>
  <a class="btn" id="nv-botao" data-promo target="_blank" rel="noopener"></a>
</div></section>
</main>

<footer><div class="wrap">
  <a class="logo" href="#topo"><img src="img/k.jpg" alt="" width="26" height="26"><span id="f-logo"></span></a><br>
  <span id="f-frase"></span><br><span id="f-frase2"></span><br><span id="f-horario"></span>
</div></footer>

<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="Falar pelo WhatsApp">WhatsApp</a>

<dialog id="md" aria-labelledby="md-t">
  <div class="mbox">
    <button class="mx" type="button" data-fechar aria-label="Fechar">×</button>
    <div class="mg"><div class="mg-main" id="mg-main"></div><div class="mth" id="mth"></div></div>
    <div class="mi">
      <p class="cat" id="md-cat"></p>
      <h3 id="md-t"></h3>
      <p class="sku" id="md-sku"></p>
      <div class="pr" id="md-pr"></div>
      <div class="md" id="md-d"></div>
      <div id="md-opc"></div>
    </div>
  </div>
</dialog>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Carrinho">
  <div class="dh"><h3>Seu carrinho</h3><button class="x" id="close" type="button" aria-label="Fechar">×</button></div>
  <div class="dbody">
    <div class="items" id="items"></div>
    <div class="bloco" id="b-cupom" hidden>
      <label class="t" for="cupom-in">Cupom de desconto</label>
      <div class="lin2"><input id="cupom-in" type="text" autocomplete="off" autocapitalize="characters" placeholder="Código do cupom"><button class="btn ghost" id="cupom-ok" type="button">Aplicar</button></div>
      <p class="msg" id="cupom-msg" aria-live="polite"></p>
    </div>
    <div class="bloco" id="b-frete" hidden>
      <label class="t" for="cep-in">Calcular frete</label>

/* Conteúdo: data/site.json (textos, WhatsApp, marcas) e data/produtos.json (peças).
   Aqui só existe a lógica da página — não é preciso editar este arquivo para atualizar o site. */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const set=(s,v)=>{const n=$(s);if(n)n.textContent=v==null?'':v};

const FUNDO='#c8b49a';
let S,P=[],SEL=[],cat='Todos',cart=[],TAM={},COR={},IDX={},need=0,modalId=null;
let Q='',ORD='',PROMO=false,PAG=24;const PASSO=24;
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
/* Mídia: fotos e vídeos curtos na mesma lista. O pôster do vídeo é o mesmo caminho com .jpg */
const ehVideo=s=>/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(s||'');
const poster=s=>String(s).replace(/\.(mp4|webm|mov|m4v)$/i,'.jpg');

async function json(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error(url+' → HTTP '+r.status);

function erro(m){const e=$('#erro');e.textContent=m;e.classList.add('on')}

/* Markdown básico (igual no admin): **negrito**, *itálico*, listas com "- " e parágrafos.
   O texto é escapado antes — não aceita HTML, então é seguro. */
function md(src){
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const il=s=>esc(s)
    .replace(/\*\*([^\s*](?:[^*]*?[^\s*])?)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^\s_](?:[^_]*?[^\s_])?)__/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^\s*](?:[^*]*?[^\s*])?)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/(^|[^_\w])_([^\s_](?:[^_]*?[^\s_])?)_(?![_\w])/g,'$1<em>$2</em>');
  const li=/^\s*[-*•]\s+/;
  return String(src||'').replace(/\r/g,'').trim().split(/\n{2,}/).filter(Boolean).map(b=>{
    const ls=b.split('\n');
    if(ls.every(l=>li.test(l)))return '<ul>'+ls.map(l=>'<li>'+il(l.replace(li,''))+'</li>').join('')+'</ul>';
    return '<p>'+ls.map(il).join('<br>')+'</p>';
  }).join('');
}

/* Preço efetivo: "preco" é o valor promocional e "precoAntigo" o valor normal.
   Com "promoAte" (AAAA-MM-DD), a promoção vale até o fim desse dia; depois o site
   passa a cobrar o precoAntigo, sem riscado nem selo. */
const numero=v=>parseFloat(String(v).replace(',','.'));
function precos(p){
  const atual=numero(p.preco),antigo=numero(p.precoAntigo);
  let fim=null;
  if(p.promoAte){const s=String(p.promoAte);const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T23:59:59':s);if(!isNaN(d))fim=d}
  const venceu=fim&&Date.now()>fim.getTime();
  if(antigo>atual&&venceu)return {preco:antigo,precoAntigo:0,desc:0,promoFim:''};
  if(antigo>atual)return {preco:atual,precoAntigo:antigo,desc:Math.round((1-atual/antigo)*100),promoFim:fim?fim.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''};
  return {preco:atual,precoAntigo:0,desc:0,promoFim:''};
}
const normCores=c=>[].concat(c||[]).map(x=>typeof x==='string'?{nome:x,valor:x}:{nome:x.nome||x.valor||'',valor:x.valor||x.nome||'#999'}).filter(x=>x.nome);
const falta=p=>{const f=[];if(p.tams.length&&!TAM[p.id])f.push('tamanho');if(p.cores.length&&!COR[p.id])f.push('cor');return f};

function badge(p){
  if(p.selo)return p.selo;
  return p.estoque<=0?'Esgotado':p.estoque===1?'Última peça':p.estoque<=2?'Últimas unidades':'';
}
function foto(box,p){

}
function preco(p,pop){

  if(p.promoFim)d.append(el('small','ate','Promoção até '+p.promoFim));
  return d;
}

/* Tamanhos e cores (usado no cartão e no popup) */
function opcoes(p){
  const w=el('div','opc'),f=falta(p),n=need===p.id;
  if(p.tams.length){
    const box=el('div','szs'+(n&&f.includes('tamanho')?' need':''));box.setAttribute('role','group');box.setAttribute('aria-label','Tamanho');
    p.tams.forEach(t=>{const b=el('button','tb'+(TAM[p.id]===t?' on':''),t);b.type='button';b.dataset.tam=t;b.dataset.id=p.id;b.setAttribute('aria-pressed',TAM[p.id]===t);box.append(b)});
    w.append(box);
  }
  if(p.cores.length){
    const box=el('div','szs cores'+(n&&f.includes('cor')?' need':''));box.setAttribute('role','group');box.setAttribute('aria-label','Cor');
    p.cores.forEach(c=>{
      const b=el('button','cb'+(COR[p.id]===c.nome?' on':''));b.type='button';b.dataset.cor=c.nome;b.dataset.id=p.id;
      b.style.background=c.valor;b.title=c.nome;b.setAttribute('aria-label','Cor '+c.nome);b.setAttribute('aria-pressed',COR[p.id]===c.nome);box.append(b);
    });
    box.append(el('span','cn',COR[p.id]||'Escolha a cor'));w.append(box);
  }
  return w;
}
function botaoAdd(p){
  const out=!(p.estoque>0),inC=cart.some(x=>x.id===p.id),f=falta(p);
  const rot=out?'Indisponível':inC?'No carrinho ✓':need===p.id&&f.length?'Escolha '+(f.length>1?'tamanho e cor':f[0]==='cor'?'a cor':'o tamanho'):'Adicionar ao carrinho';
  const b=el('button','btn add'+(inC?' in':''),rot);b.type='button';b.dataset.add=p.id;b.disabled=out;return b;
}

function card(p){
  const a=el('article','pc'),ph=el('div','ph');ph.style.background=p.fundo||FUNDO;
  if(p.capa)foto(ph,{foto:p.capa,nome:p.nome});
  ph.dataset.open=p.id;ph.tabIndex=0;ph.setAttribute('role','button');ph.setAttribute('aria-label','Ver detalhes de '+p.nome);
  if(badge(p))ph.append(el('span','badge',badge(p)));
  if(p.desc)ph.append(el('span','off','-'+p.desc+'%'));
  if(p.imgs.length>1||p.imgs.some(ehVideo))ph.append(el('span','nfotos','▣ '+p.imgs.length+(p.imgs.some(ehVideo)?' · ▶':'')));
  const info=el('div','info'),h=el('h3',0,p.nome);h.dataset.open=p.id;
  const ver=el('button','ver','Ver detalhes');ver.type='button';ver.dataset.open=p.id;
  info.append(h,preco(p),ver);
  if(!(p.estoque<=0)&&(p.tams.length||p.cores.length))info.append(opcoes(p));
  info.append(botaoAdd(p));
  a.append(ph,info);return a;
}

function renderChips(){
  const cs=['Todos',...new Set(P.flatMap(p=>p.cats))];
  $('#chips').replaceChildren(...cs.map(c=>{const b=el('button','chip'+(c===cat?' on':''),c);b.type='button';b.dataset.c=c;return b}));
}
function filtrados(){
  const termos=norm(Q).split(/\s+/).filter(Boolean);
  let l=P.filter(p=>(cat==='Todos'||p.cats.includes(cat))&&(!PROMO||p.desc>0)&&termos.every(t=>p._h.includes(t)));
  const ordens={menor:(a,b)=>a.preco-b.preco,maior:(a,b)=>b.preco-a.preco,az:(a,b)=>a.nome.localeCompare(b.nome,'pt-BR'),desc:(a,b)=>b.desc-a.desc};
  const disp=p=>p.estoque>0?0:1; // esgotadas sempre por último
  l=ORD?l.slice().sort((a,b)=>disp(a)-disp(b)||ordens[ORD](a,b)):[...l.filter(p=>disp(p)===0),...l.filter(p=>disp(p)===1)];
  return l;
}
function renderGrid(){

    const p=el('p','empty',(Q||PROMO||cat!=='Todos')?'Nenhuma peça encontrada com esses filtros. ':'Nenhuma peça disponível no momento.');

}

/* ---------- Carrinho, cupom e frete ---------- */
const r2=v=>Math.round(v*100)/100;
const soDig=s=>String(s||'').replace(/\D/g,'');
const fmtCep=c=>c.length===8?c.slice(0,5)+'-'+c.slice(5):c;
const cod=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'');
const skuVar=(p,tam,cor)=>p.sku?[p.sku,tam&&cod(tam),cor&&cod(cor).slice(0,3)].filter(Boolean).join('-'):'';
let CUPOM=null,FR={cep:'',info:null,opcao:'entrega',erro:''};
const frete=()=>S.frete&&S.frete.ativo!==false?S.frete:null;
const cupons=()=>(S.cupons||[]).filter(c=>c.ativo!==false&&c.codigo);
/* Faixas de CEP: "88000-000 a 89999-999", um CEP "88300-000" ou um prefixo "883" */
function faixa(t){
  const d=(String(t).match(/\d{5}-?\d{3}|\d{2,7}/g)||[]).map(soDig);
  if(!d.length)return null;
  if(d.length===1)return d[0].length===8?[+d[0],+d[0]]:[+d[0].padEnd(8,'0'),+d[0].padEnd(8,'9')];
  return [+d[0].padEnd(8,'0'),+d[1].padEnd(8,'9')];
}
const regraCep=cep=>((frete()||{}).regras||[]).find(r=>(r.cep||[]).some(t=>{const f=faixa(t);return f&&+cep>=f[0]&&+cep<=f[1]}))||null;

function erroCupom(c,sub){
  if(c.validoAte){const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(c.validoAte)?c.validoAte+'T23:59:59':c.validoAte);if(!isNaN(d)&&Date.now()>d.getTime())return 'Este cupom expirou.'}
  if(c.minimo>0&&sub<c.minimo)return 'Pedido mínimo de '+brl(c.minimo)+' para este cupom.';
  if(c.soSemPromo&&!cart.some(x=>!x.promo))return 'Este cupom vale só para peças sem promoção.';
  return '';
}
function totais(){
  const sub=r2(cart.reduce((a,x)=>a+x.preco,0));
  let desc=0,gratisCupom=false,cerro='';
  if(CUPOM){
    cerro=erroCupom(CUPOM,sub);
    if(!cerro){
      const base=CUPOM.soSemPromo?cart.filter(x=>!x.promo).reduce((a,x)=>a+x.preco,0):sub;
      if(CUPOM.tipo==='percentual')desc=r2(base*Math.min(100,CUPOM.valor)/100);
      else if(CUPOM.tipo==='valor')desc=r2(Math.min(CUPOM.valor,base));
      else if(CUPOM.tipo==='frete')gratisCupom=true;
    }
  }
  const liq=r2(sub-desc),F=frete();let fr=null,frRot='',prazo='';
  if(F&&cart.length){
    if(FR.opcao==='retirada'&&F.retirada&&F.retirada.ativo){fr=0;frRot=F.retirada.texto||'Retirada na loja'}
    else if(FR.info&&FR.info.regra){fr=valorFrete(FR.info.regra,liq,gratisCupom);frRot='Entrega — '+FR.info.regra.nome;prazo=FR.info.regra.prazo||''}
  }
  return {sub,desc,liq,fr,frRot,prazo,total:r2(liq+(fr||0)),cerro,gratisCupom};
}
function valorFrete(rg,liq,gratisCupom){
  const F=frete(),lim=rg.gratisAcima>0?rg.gratisAcima:(F.gratisAcima||0);
  return gratisCupom||(lim>0&&liq>=lim)?0:r2(rg.valor);
}
const det=x=>[x.tam&&'tam. '+x.tam,x.cor&&'cor '+x.cor].filter(Boolean).join(', ');
function msgPedido(T){
  let m='Olá! Gostaria de finalizar meu pedido:\n'+cart.map(x=>'• '+x.nome+(det(x)?' ('+det(x)+')':'')+(x.sku?' [SKU '+x.sku+']':'')+' — '+brl(x.preco)).join('\n');
  m+='\nSubtotal: '+brl(T.sub);
  if(T.desc>0)m+='\nCupom '+CUPOM.codigo+': -'+brl(T.desc);
  if(CUPOM&&T.gratisCupom&&!T.cerro)m+='\nCupom '+CUPOM.codigo+': frete grátis';
  if(T.fr!=null){
    m+='\n'+T.frRot+(FR.cep&&T.frRot.startsWith('Entrega')?' — CEP '+fmtCep(FR.cep)+(FR.info&&FR.info.cidade?' ('+FR.info.cidade+'/'+FR.info.uf+')':''):'')+': '+(T.fr===0?'grátis':brl(T.fr))+(T.prazo?' ('+T.prazo+')':'');
  }else if(frete())m+='\nEntrega: a combinar (CEP não informado)';
  return m+'\nTotal: '+brl(T.total);
}
function renderCupomMsg(T){
  const m=$('#cupom-msg');m.replaceChildren();m.className='msg';
  if(FR.cupomErro){const e=el('div','msg er',FR.cupomErro);e.style.margin='0 0 4px';m.append(e)}
  if(!CUPOM)return;
  const l=el('div');
  if(T.cerro){l.className='er';l.style.color='#c0504d';l.append(T.cerro+' ('+CUPOM.codigo+')')}
  else{l.style.color='var(--ink)';l.append('✓ Cupom '+CUPOM.codigo+' aplicado'+(CUPOM.tipo==='frete'?' (frete grátis).':CUPOM.tipo==='percentual'?' (-'+CUPOM.valor+'%).':' (-'+brl(CUPOM.valor)+').'))}
  const x=el('button',0,'remover');x.type='button';x.dataset.rmcupom='1';l.append(x);m.append(l);
}
function renderFrete(T){
  const box=$('#frete-res');box.replaceChildren();
  const F=frete();if(!F)return;
  if(FR.erro){box.append(el('p','msg er',FR.erro));return}
  if(!FR.cep||!FR.info)return;
  const i=FR.info;
  box.append(el('p','msg','CEP '+fmtCep(FR.cep)+(i.cidade?' · '+i.cidade+'/'+i.uf:'')));
  const opt=(val,rot,sub)=>{
    const l=el('label','opf'),r=el('input');r.type='radio';r.name='fr';r.value=val;r.checked=FR.opcao===val;r.dataset.fr=val;
    const s=el('span');s.append(rot);if(sub)s.append(el('small',0,sub));l.append(r,s);box.append(l);
  };
  if(i.regra){const v=valorFrete(i.regra,T.liq,T.gratisCupom);opt('entrega','Entrega — '+i.regra.nome+' — '+(v===0?'Grátis':brl(v)),i.regra.prazo||'')}
  if(F.retirada&&F.retirada.ativo)opt('retirada',(F.retirada.texto||'Retirar na loja')+' — Grátis','');
  if(!i.regra&&!(F.retirada&&F.retirada.ativo))box.append(el('p','msg er','Não encontramos entrega para este CEP. Fale com a gente pelo WhatsApp.'));
  else if(!i.regra)box.append(el('p','msg','Entrega não disponível para este CEP; use a retirada ou fale pelo WhatsApp.'));
}
function renderCart(){
  const T=totais();
  set('#cnt',cart.length);set('#total',brl(T.total));set('#sub',brl(T.sub));
  $('#items').replaceChildren(...(cart.length?cart.map(x=>{
    const it=el('div','it'),sw=el('div','sw');sw.style.background=x.bg;foto(sw,x);
    const d=el('div','d'),sm=el('small',0,det(x)?det(x)+' · ':''),pv=el('span',0,brl(x.preco));pv.style.whiteSpace='nowrap';sm.append(pv);d.append(el('b',0,x.nome),sm);
    const r=el('button','rm','Remover');r.type='button';r.dataset.rm=x.id;
    it.append(sw,d,r);return it;
  }):[el('p','dempty','Seu carrinho está vazio.')]));
  $('#b-cupom').hidden=!(cupons().length&&cart.length);
  $('#b-frete').hidden=!(frete()&&cart.length);
  renderCupomMsg(T);renderFrete(T);
  $('#l-desc').hidden=!(T.desc>0);
  if(T.desc>0){set('#desc-rot','Cupom '+CUPOM.codigo);set('#desc-val','-'+brl(T.desc))}
  $('#l-frete').hidden=T.fr==null;
  if(T.fr!=null){set('#frete-rot',T.frRot);set('#frete-val',T.fr===0?'Grátis':brl(T.fr))}
  $('#checkout').href=cart.length?zap(msgPedido(T)):'#';
  $('#checkout').style.opacity=cart.length?1:.4;
  saveCart();
}

function aplicarCupom(){
  const c=$('#cupom-in').value.trim().toUpperCase().replace(/\s+/g,'');
  FR.cupomErro='';
  if(!c){FR.cupomErro='Digite o código do cupom.';renderCart();return}
  const f=cupons().find(x=>String(x.codigo).toUpperCase()===c);
  if(!f){FR.cupomErro='Cupom inválido.';renderCart();return}
  const e=erroCupom(f,r2(cart.reduce((a,x)=>a+x.preco,0)));
  if(e){FR.cupomErro=e;renderCart();return}
  CUPOM={...f,codigo:String(f.codigo).toUpperCase()};$('#cupom-in').value='';renderCart();
}
async function calcularCep(){
  const cep=soDig($('#cep-in').value);
  if(cep.length!==8){FR={cep:'',info:null,opcao:'entrega',erro:'Informe um CEP com 8 dígitos.'};renderCart();return}
  $('#frete-res').replaceChildren(el('p','msg','Calculando…'));
  let cidade='',uf='';
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/',{signal:ctl.signal});clearTimeout(t);
    if(r.ok){const j=await r.json();if(j.erro){FR={cep:'',info:null,opcao:'entrega',erro:'CEP não encontrado.'};renderCart();return}cidade=j.localidade||'';uf=j.uf||''}
  }catch(e){/* sem internet para o ViaCEP: segue só com as faixas de CEP */}
  const regra=regraCep(cep),F=frete();
  FR={cep,info:{cidade,uf,regra},opcao:regra?'entrega':(F.retirada&&F.retirada.ativo?'retirada':'entrega'),erro:'',cupomErro:''};
  renderCart();
}
$('#cupom-ok').onclick=aplicarCupom;
$('#cupom-in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();aplicarCupom()}});
$('#cep-ok').onclick=calcularCep;

$('#cep-in').addEventListener('input',e=>{const d=soDig(e.target.value).slice(0,8);e.target.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d});

/* Carrinho, cupom e CEP salvos no navegador (só volta o que ainda existe e está em estoque) */
const CK='constita-cart';
function loadCart(){
  try{
    let raw=JSON.parse(localStorage.getItem(CK)||'[]');
    const extra=Array.isArray(raw)?{}:raw;if(!Array.isArray(raw))raw=raw.itens||[];
    if(!Array.isArray(raw))return [];
    const vistos=new Set();
    const itens=raw.map(r=>{
      const p=P.find(x=>x.nome===r.nome&&x.estoque>0);if(!p||vistos.has(p.id))return null;
      vistos.add(p.id);
      if(r.tam&&p.tams.includes(r.tam))TAM[p.id]=r.tam;
      if(r.cor&&p.cores.some(c=>c.nome===r.cor))COR[p.id]=r.cor;
      return {id:p.id,nome:p.nome,preco:p.preco,tam:TAM[p.id]||'',cor:COR[p.id]||'',bg:p.fundo||FUNDO,foto:p.capa,sku:skuVar(p,TAM[p.id],COR[p.id]),promo:!!p.precoAntigo};
    }).filter(Boolean);
    if(extra.cupom){const c=cupons().find(x=>String(x.codigo).toUpperCase()===extra.cupom);if(c)CUPOM={...c,codigo:String(c.codigo).toUpperCase()}}
    if(extra.cep&&frete()){const regra=regraCep(extra.cep);FR={cep:extra.cep,info:{cidade:extra.cid||'',uf:extra.uf||'',regra},opcao:extra.opcao||'entrega',erro:''}}
    return itens;
  }catch(e){try{localStorage.removeItem(CK)}catch(_){}return []}
}
function saveCart(){
  try{localStorage.setItem(CK,JSON.stringify({
    itens:cart.map(x=>({nome:x.nome,tam:x.tam,cor:x.cor})),
    cupom:CUPOM?CUPOM.codigo:'',cep:FR.cep,cid:FR.info?FR.info.cidade:'',uf:FR.info?FR.info.uf:'',opcao:FR.opcao
  }))}catch(e){}
}

function add(id){
  const p=P.find(x=>x.id===id);if(!p||!(p.estoque>0))return;
  if(cart.some(x=>x.id===id)){cart=cart.filter(x=>x.id!==id);draw();return}
  if(falta(p).length){need=id;draw();return}
  cart.push({id,nome:p.nome,preco:p.preco,tam:TAM[id]||'',cor:COR[id]||'',bg:p.fundo||FUNDO,foto:p.capa,sku:skuVar(p,TAM[id],COR[id]),promo:!!p.precoAntigo});
  need=0;
  if(dlg.open)dlg.close();
  draw();toggle(true);
}

/* ---------- Popup de detalhes ---------- */
const idx=p=>{const n=p.imgs.length||1;return((IDX[p.id]||0)%n+n)%n};
function abrir(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  modalId=id;
  set('#md-cat',p.cats.join(' · '));set('#md-t',p.nome);
  $('#md-pr').replaceChildren(...preco(p,true).childNodes);
  const d=$('#md-d');d.innerHTML=p.descricao?md(p.descricao):'';d.hidden=!p.descricao;
  galModal();opcModal();
  document.documentElement.classList.add('trava');dlg.showModal();dlg.scrollTop=0;
}
function galModal(){
  const p=P.find(x=>x.id===modalId);if(!p)return;
  const L=p.imgs,i=idx(p),main=$('#mg-main');
  main.replaceChildren();main.style.background=p.fundo||FUNDO;
  if(L.length&&ehVideo(L[i])){
    const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.poster=poster(L[i]);v.src=L[i];
    v.setAttribute('aria-label',p.nome+' — vídeo '+(i+1)+' de '+L.length);main.append(v);
  }else if(L.length){const im=new Image();im.alt=p.nome+' — foto '+(i+1)+' de '+L.length;im.onerror=()=>im.remove();im.src=L[i];main.append(im)}
  else main.append(el('span','ini',p.nome.charAt(0)));
  if(L.length>1){
    const pv=el('button','mn p','‹'),nx=el('button','mn n','›');
    pv.type=nx.type='button';pv.dataset.nav=-1;nx.dataset.nav=1;pv.setAttribute('aria-label','Foto anterior');nx.setAttribute('aria-label','Próxima foto');
    main.append(pv,nx,el('span','mct',(i+1)+' / '+L.length));
  }
  $('#mth').replaceChildren(...(L.length>1?L.map((s,k)=>{
    const b=el('button',k===i?'on':'');b.type='button';b.dataset.th=k;b.setAttribute('aria-label','Ver foto '+(k+1));
    const im=new Image();im.alt='';im.src=imgSrc(s);im.loading='lazy';im.onerror=()=>im.remove();b.append(im);if(ehVideo(s))b.append(el('span','pl','▶'));return b;
  }):[]));
}
function opcModal(){
  const p=P.find(x=>x.id===modalId);if(!p)return;
  set('#md-sku',p.sku?'SKU '+skuVar(p,TAM[p.id],COR[p.id]):'');
  const w=$('#md-opc');w.replaceChildren();w.style.display='grid';w.style.gap='12px';
  if(p.estoque>0&&(p.tams.length||p.cores.length))w.append(opcoes(p));
  w.append(botaoAdd(p));
}
function navFoto(n){
  const p=P.find(x=>x.id===modalId);if(!p||p.imgs.length<2)return;
  IDX[p.id]=idx(p)+n;galModal();
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>{document.documentElement.classList.remove('trava');modalId=null});
dlg.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')navFoto(-1);else if(e.key==='ArrowRight')navFoto(1)});
let tx=null;
$('#mg-main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#mg-main').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>45)navFoto(d<0?1:-1)});

function texto(){
  document.title=S.nome+' — '+S.hero.nota;
  set('#logo',S.nome);set('#f-logo',S.nome);
  set('#h-eyebrow',S.hero.eyebrow);set('#h-chamada',S.hero.chamada);set('#h-destaque',S.hero.destaque);
  set('#h-texto',S.hero.texto);set('#aviso',S.aviso);
  set('#d-titulo',S.destaques.titulo);
  set('#p-eyebrow',S.pecas.eyebrow);set('#p-titulo',S.pecas.titulo);set('#p-texto',S.pecas.texto);
  set('#n-eyebrow',S.novaFase.eyebrow);set('#n-titulo',S.novaFase.titulo);set('#n-texto',S.novaFase.texto);set('#n-frase',S.novaFase.frase);
  set('#nv-eyebrow',S.novidades.eyebrow);set('#nv-titulo',S.novidades.titulo);set('#nv-texto',S.novidades.texto);set('#nv-botao',S.novidades.botao);
  set('#f-frase',S.rodape);set('#f-frase2',S.rodape2);set('#f-horario',S.horario);
  $('#nv-botao').href=zap(S.msgNovidades);$('#wa').href=zap(S.msgPadrao);
  $('#marcas').replaceChildren(...S.marcas.map(b=>{
    const d=el('div','brand');d.append(el('h3',0,b.nome),el('div','tag',b.subtitulo),el('p',0,b.texto));return d;
  }));
}

/* Carrossel: peças em estoque, em ordem aleatória a cada visita */
function carrossel(){
  const pool=P.filter(p=>p.estoque>0);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  SEL=pool.slice(0,S.destaques.quantidade||8);
  if(!SEL.length){$('#destaques').hidden=true;return}
  const tr=$('#track');
  const go=d=>{
    const max=tr.scrollWidth-tr.clientWidth,w=tr.firstElementChild.offsetWidth+16;
    if(d>0&&tr.scrollLeft>=max-4)tr.scrollTo({left:0,behavior:'smooth'});
    else if(d<0&&tr.scrollLeft<=4)tr.scrollTo({left:max,behavior:'smooth'});
    else tr.scrollBy({left:d*w,behavior:'smooth'});
  };
  $('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const car=tr.parentElement;let pausa=false,t;
  ['mouseenter','focusin'].forEach(e=>car.addEventListener(e,()=>pausa=true));
  ['mouseleave','focusout'].forEach(e=>car.addEventListener(e,()=>pausa=false));
  car.addEventListener('touchstart',()=>{pausa=true;clearTimeout(t);t=setTimeout(()=>pausa=false,8000)},{passive:true});
  setInterval(()=>{if(!pausa&&!document.hidden&&!dlg.open)go(1)},3500);
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c],[data-limpar],[data-add],[data-tam],[data-cor],[data-rm],[data-rmcupom],[data-open],[data-fechar],[data-nav],[data-th]');if(!c)return;
  const d=c.dataset,id=+d.id;
  if(d.fechar!==undefined)dlg.close();
  else if(d.open)abrir(+d.open);
  else if(d.nav)navFoto(+d.nav);
  else if(d.th!==undefined){IDX[modalId]=+d.th;galModal()}
  else if(d.limpar){Q='';PROMO=false;cat='Todos';$('#q').value='';$('#so-promo').checked=false;$('#q-x').hidden=true;PAG=PASSO;draw()}
  else if(d.c){cat=d.c;PAG=PASSO;draw()}
  else if(d.add)add(+d.add);
  else if(d.tam){TAM[id]=d.tam;if(need===id&&!falta(P.find(x=>x.id===id)).length)need=0;draw()}
  else if(d.cor){COR[id]=d.cor;if(need===id&&!falta(P.find(x=>x.id===id)).length)need=0;draw()}
  else if(d.rm){cart=cart.filter(x=>x.id!==+d.rm);draw()}
  else if(d.rmcupom){CUPOM=null;FR.cupomErro='';renderCart()}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ph[data-open]')){e.preventDefault();abrir(+e.target.dataset.open)}
});
let tq;
$('#q').addEventListener('input',e=>{
  clearTimeout(tq);$('#q-x').hidden=!e.target.value;
  tq=setTimeout(()=>{Q=e.target.value;PAG=PASSO;renderGrid()},150);
});
$('#q-x').onclick=()=>{$('#q').value='';Q='';$('#q-x').hidden=true;PAG=PASSO;renderGrid();$('#q').focus()};
$('#ord').onchange=e=>{ORD=e.target.value;PAG=PASSO;renderGrid()};
$('#so-promo').onchange=e=>{PROMO=e.target.checked;PAG=PASSO;renderGrid()};
$('#ver-mais').onclick=()=>{PAG+=PASSO;renderGrid()};
if('IntersectionObserver' in window)new IntersectionObserver(es=>{if(es[0].isIntersecting&&!$('#mais').hidden){PAG+=PASSO;renderGrid()}},{rootMargin:'600px'}).observe($('#mais'));
$('#checkout').addEventListener('click',e=>{if(!cart.length)e.preventDefault()});
$('#open').onclick=()=>toggle(true);$('#close').onclick=$('#ov').onclick=()=>toggle(false);
addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>40),{passive:true});

/* Prévia ao vivo vinda do editor de temas (admin/temas.html), somente na mesma origem */
addEventListener('message',e=>{
  const m=e.data;if(e.origin!==location.origin||parent===window||!m||!window.Tema)return;
  if(m.tipo==='tema'){Tema.aplicar(m.tema,{previa:true});if(m.modo)document.documentElement.setAttribute('data-modo',m.modo)}
  else if(m.tipo==='modo')document.documentElement.setAttribute('data-modo',m.modo);
});
(async()=>{
  try{
    let lista;[S,lista]=await Promise.all([json('data/site.json'),json('data/produtos.json')]);
    if(window.Tema){if(S.tema)Tema.aplicar(S.tema);else Tema.limpar()}
    P=lista.filter(p=>p.ativo!==false).map((p,i)=>({...p,...precos(p),id:i+1,cats:[].concat(p.categoria||[]),tams:p.tamanhos||[],cores:normCores(p.cores),imgs:p.fotos&&p.fotos.length?p.fotos:(p.foto?[p.foto]:[])}));
    P.forEach(p=>{p.capa=p.imgs.length?imgSrc(p.imgs[0]):'';p._h=norm([p.nome,p.sku,p.cats.join(' '),p.descricao,p.cores.map(c=>c.nome).join(' '),p.tams.join(' ')].join(' '))});
    P.forEach(p=>{if(p.tams.length===1)TAM[p.id]=p.tams[0];if(p.cores.length===1)COR[p.id]=p.cores[0].nome});
    cart=loadCart();if(FR.cep)$('#cep-in').value=fmtCep(FR.cep);texto();carrossel();draw();
  }catch(e){
    console.error(e);
    erro(location.protocol==='file:'
      ?'Abra o site por um servidor (não clicando no arquivo). Na pasta do projeto rode: python3 -m http.server 8080  ou  busybox httpd -f -p 8080  e acesse http://localhost:8080'
      :'Erro ao carregar o conteúdo: '+e.message);
  }
})();
</script>
