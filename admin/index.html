<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — CONSTITA</title>
<style>
:root{--bg:#faf8f4;--ink:#1c1814;--mute:#7a7066;--line:#e6dfd4;--card:#f3eee6;--dk:#1c1814;--dkt:#faf8f4;--ok:#2f6b46;--err:#a33a3a;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;--serif:Georgia,'Times New Roman',serif}
@media(prefers-color-scheme:dark){:root{--bg:#161311;--ink:#f1ebe1;--mute:#a1968a;--line:#332d27;--card:#1e1a17;--dk:#f1ebe1;--dkt:#161311;--ok:#7fc79b;--err:#e08a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-bottom:110px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2{font-family:var(--serif);font-weight:400;margin:0}
h1{font-size:30px;padding:28px 0 6px}h2{font-size:22px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
section,details{border-top:1px solid var(--line);padding:26px 0}
summary{cursor:pointer;font:400 22px var(--serif)}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:0}
input.bad{border-color:var(--err);outline:1px solid var(--err)}
.row{display:grid;gap:12px}
@media(min-width:700px){.row.c2{grid-template-columns:1fr 1fr}.row.c4{grid-template-columns:2fr 1fr 1fr 1fr}}
.btn{padding:11px 20px;border:1px solid var(--dk);background:var(--dk);color:var(--dkt);font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{padding:6px 12px;font-size:11px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:13px;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0 0 6px}
.chk input{margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.tile{border:2px dashed var(--line);background:var(--card);padding:18px 12px;text-align:center;cursor:pointer;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:border-color .15s,background .15s}
